name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    # Newest image with Python 3.9 builds; macOS still ships 3.9 as /usr/bin/python3.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
