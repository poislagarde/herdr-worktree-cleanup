id = "poislagarde.worktree-cleanup"
name = "Worktree Cleanup"
version = "0.5.0"
min_herdr_version = "0.9.0"
description = "Clean disposable files and unused worktree checkouts while preserving local work, and revive panes whose checkout was deleted."
platforms = ["linux", "macos"]

[[startup]]
command = ["python3", "plugin.py", "restore"]

[[actions]]
id = "check"
title = "Check worktree cleanup eligibility"
contexts = ["workspace"]
command = ["python3", "plugin.py", "check"]

[[actions]]
id = "check-unused"
title = "Preview cleanup of known unused worktrees"
contexts = ["global", "workspace"]
command = ["python3", "plugin.py", "check-unused"]

[[actions]]
id = "clean-unused"
title = "Clean known unused worktrees"
contexts = ["global", "workspace"]
command = ["python3", "plugin.py", "clean-unused"]

[[actions]]
id = "restore"
title = "Recreate deleted worktrees under restored panes"
contexts = ["global", "workspace"]
command = ["python3", "plugin.py", "restore"]

[[actions]]
id = "observe"
title = "Record open worktrees for future cleanup"
contexts = ["global", "workspace"]
command = ["python3", "plugin.py", "observe"]

[[events]]
on = "workspace.created"
command = ["python3", "plugin.py", "observe"]

[[events]]
on = "worktree.created"
command = ["python3", "plugin.py", "observe"]

[[events]]
on = "worktree.opened"
command = ["python3", "plugin.py", "observe"]

[[events]]
on = "workspace.closed"
command = ["python3", "plugin.py", "event"]

[[events]]
on = "pane.exited"
command = ["python3", "plugin.py", "event"]

[[events]]
on = "pane.moved"
command = ["python3", "plugin.py", "observe"]

[[actions]]
id = "drain"
title = "Validate queued worktree registrations"
contexts = ["global", "workspace"]
command = ["python3", "plugin.py", "drain"]
